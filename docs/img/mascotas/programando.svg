<svg xmlns="http://www.w3.org/2000/svg" class="mascot" viewBox="40 150 940 700" role="img" aria-label="Mascota naranja escribiendo código en su portátil" data-mood="typing">
<style><![CDATA[
  :root {
    --shadow: rgba(0, 0, 0, 0.18);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1); /* easings.net easeOutBack */
  }

  .mascot { cursor: pointer; }

  /* --- whole character: hop on happy, jolt on surprise --- */
  .rig { transform-box: fill-box; transform-origin: 50% 100%; }
  [data-mood="happy"] .rig { animation: hop 650ms var(--ease-out) 1; }
  [data-mood="surprise"] .rig { animation: jolt 320ms var(--ease-out) 1; }
  @keyframes hop {
    0%   { transform: none; }
    18%  { transform: scale(1.04, 0.95); }
    50%  { transform: translateY(-40px) scale(0.98, 1.03); }
    82%  { transform: scale(1.02, 0.97); }
    100% { transform: none; }
  }
  @keyframes jolt { 35% { transform: translateY(-16px); } }
  .floor { transform-box: fill-box; transform-origin: 50% 50%; }
  [data-mood="happy"] .floor { animation: floor 650ms var(--ease-out) 1; }
  @keyframes floor { 50% { transform: scale(0.85); } }

  .bob { animation: bob 360ms ease-in-out infinite alternate; }
  [data-mood="fast"] .bob { animation-duration: 220ms; }
  [data-mood="happy"] .bob, [data-mood="surprise"] .bob { animation: none; }
  @keyframes bob { to { transform: translateY(5px); } }

  /* --- arms: rotate around the shoulder (the group's local origin) ---
     pose: down to the sides while typing, up in the original V when happy */
  .pose { transition: transform 260ms var(--ease-out); }
  /* typing: hanging down beside the laptop (≈80°/100°); surprise: flung out sideways */
  .armL .pose { transform: rotate(-138.7deg); }
  .armR .pose { transform: rotate(137.4deg); }
  [data-mood="happy"] .pose { transform: none; transition: transform 450ms var(--ease-out-back); }
  [data-mood="surprise"] .armL .pose { transform: rotate(-60deg); }
  [data-mood="surprise"] .armR .pose { transform: rotate(60deg); }

  .wig { animation: tap 180ms ease-in-out infinite alternate; }
  .armR .wig { animation: tapR 180ms ease-in-out -90ms infinite alternate; }
  [data-mood="fast"] .wig { animation-duration: 100ms; }
  [data-mood="happy"] .wig { animation: cheer 320ms ease-in-out 450ms infinite alternate; }
  [data-mood="happy"] .armR .wig { animation-delay: 610ms; }
  [data-mood="surprise"] .wig { animation: none; }
  @keyframes tap   { to { transform: rotate(-7deg); } }
  @keyframes tapR  { to { transform: rotate(7deg); } }
  @keyframes cheer { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }

  /* keys popping out from behind the screen */
  .keys rect { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; animation: key 900ms var(--ease-out) infinite; }
  .keys rect:nth-child(2) { animation-delay: 300ms; }
  .keys rect:nth-child(3) { animation-delay: 600ms; }
  [data-mood="fast"] .keys rect { animation-duration: 500ms; }
  .keys { transition: opacity 200ms var(--ease-out); }
  [data-mood="happy"] .keys, [data-mood="surprise"] .keys { opacity: 0; }
  @keyframes key {
    0%   { opacity: 0; transform: none; }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-60px) rotate(40deg); }
  }

  /* --- face --- */
  .eyes { transition: transform 220ms var(--ease-out); }
  .lid, .happy, .mouth, .blush {
    transform-box: fill-box; transform-origin: 50% 50%;
    transition: transform 180ms var(--ease-out), opacity 180ms var(--ease-out);
  }
  .happy, .mouth, .blush { opacity: 0; }
  .happy { transform: translateY(8px) scale(0.8); }
  .mouth { transform: scale(0.6); }
  [data-mood="fast"] .lid     { transform: translateY(8px) scaleY(0.4); }
  [data-mood="surprise"] .lid { transform: scale(1.3); }
  [data-mood="happy"] .lid    { opacity: 0; transform: scale(0.7); }
  [data-mood="happy"] .happy  { opacity: 1; transform: none; }
  [data-mood="happy"] .blush  { opacity: 0.5; }
  [data-mood="surprise"] .mouth { opacity: 1; transform: none; }
  [data-blink]:not([data-mood="happy"]) .lid { transform: scaleY(0.1); transition-duration: 70ms; }

  /* --- screen --- */
  .code, .logo, .alert { transform-box: fill-box; transform-origin: 50% 50%;
    transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out); }
  .logo, .alert { opacity: 0; transform: scale(0.9); }
  [data-mood="happy"] .code, [data-mood="surprise"] .code { opacity: 0; }
  [data-mood="happy"] .logo, [data-mood="surprise"] .alert { opacity: 1; transform: none; }
  .caret { animation: caret 1s steps(1) infinite; }
  [data-mood="happy"] .caret, [data-mood="surprise"] .caret { opacity: 0; animation: none; }
  @keyframes caret { 50% { opacity: 0; } }
  .flash { opacity: 0; }
  [data-mood="surprise"] .flash { animation: flash 400ms var(--ease-out) 1; }
  @keyframes flash { 0% { opacity: 0.5; } 100% { opacity: 0; } }

  /* sparkles and burst lines: the original drawing's celebration */
  .spark, .burst { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%;
    transform: scale(0.6) rotate(-30deg);
    transition: opacity 200ms var(--ease-out), transform 350ms var(--ease-out-back); }
  .burst { transform: scale(0.6); }
  [data-mood="happy"] :is(.spark, .burst) { opacity: 1; transform: none; transition-delay: 150ms; }
  [data-mood="happy"] .burst { transition-delay: 220ms; }
  [data-mood="happy"] .spark { animation: twinkle 900ms ease-in-out 600ms infinite alternate; }
  [data-mood="happy"] .spark:nth-of-type(2) { animation-delay: 1050ms; }
  @keyframes twinkle { to { transform: scale(0.85) rotate(12deg); } }

  @media (prefers-reduced-motion: reduce) {
    /* keep expressions and screen changes, drop movement */
    .rig, .floor, .bob, .wig, .keys rect, .spark { animation: none !important; }
    .keys { display: none; }
    .pose { transition: none !important; }
    .spark, .burst { transform: none; }
  }
]]></style>
  <ellipse class="floor" cx="524" cy="812" rx="366" ry="38" fill="var(--shadow)"/>

  <g class="rig">
    <g class="bob">
      <!-- arms behind the body; origin of each group is the shoulder -->
      <g class="armL" transform="translate(301 571) rotate(-141.3)">
        <g class="pose"><g class="wig"><rect x="-40" y="-42" width="201" height="84" fill="#dd7352"/></g></g>
      </g>
      <g class="armR" transform="translate(747 569) rotate(-37.4)">
        <g class="pose"><g class="wig"><rect x="-40" y="-42" width="201" height="84" fill="#dd7352"/></g></g>
      </g>

      <rect x="300" y="396" width="450" height="400" fill="#dd7352"/>

      <rect class="blush" x="366" y="512" width="86" height="20" rx="10" fill="#f2a08a"/>
      <rect class="blush" x="606" y="512" width="86" height="20" rx="10" fill="#f2a08a"/>
      <g class="eyes">
        <rect class="lid" x="389" y="452" width="40" height="44" fill="#090909"/>
        <rect class="lid" x="629" y="452" width="40" height="44" fill="#090909"/>
        <path class="happy" d="M374 494 L409 457 L444 494" fill="none" stroke="#090909" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="happy" d="M614 494 L649 457 L684 494" fill="none" stroke="#090909" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <rect class="mouth" x="518" y="522" width="22" height="22" fill="#090909"/>
    </g>
  </g>

  <!-- behind the laptop so they pop out from its top edge -->
  <g class="keys" fill="#c29877">
    <rect x="420" y="600" width="14" height="14" rx="2"/>
    <rect x="520" y="600" width="14" height="14" rx="2"/>
    <rect x="620" y="600" width="14" height="14" rx="2"/>
  </g>

  <g class="laptop">
    <polygon points="330,598 725,598 702,806 353,806" fill="#43352c" stroke="#43352c" stroke-width="30" stroke-linejoin="round"/>
    <polygon class="flash" points="330,598 725,598 702,806 353,806" fill="#f4eae1"/>
    <g class="code"></g>
    <rect class="caret" x="370" y="622" width="12" height="18" fill="#e8c9a6"/>
    <g class="logo" fill="none" stroke="#c29877" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="481,670 448,706 481,742"/>
      <line x1="541" y1="662" x2="514" y2="748"/>
      <polyline points="574,670 607,706 574,742"/>
    </g>
    <g class="alert" fill="#c29877">
      <rect x="517" y="650" width="22" height="64" rx="11"/>
      <circle cx="528" cy="742" r="12"/>
    </g>
  </g>

  <g fill="#d99d57">
    <path class="spark" d="M228 202C238 252 238 252 286 262C238 272 238 272 228 322C218 272 218 272 170 262C218 252 218 252 228 202Z"/>
    <path class="spark" d="M803 175C813 225 813 225 861 235C813 245 813 245 803 295C793 245 793 245 745 235C793 225 793 225 803 175Z"/>
  </g>
  <g stroke="#c29877" stroke-width="22" stroke-linecap="round">
    <line class="burst" x1="134" y1="338" x2="165" y2="392"/>
    <line class="burst" x1="72" y1="410" x2="122" y2="438"/>
    <line class="burst" x1="890" y1="328" x2="861" y2="380"/>
    <line class="burst" x1="902" y1="426" x2="954" y2="398"/>
  </g>
<script><![CDATA[
  const svg = document.documentElement;
  const code = svg.querySelector('.code');
  const caret = svg.querySelector('.caret');
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // code lines: [indent, segment widths]; segments alternate two syntax colours
  const LINES = [[0, [56, 84]], [24, [40, 110]], [24, [130]], [48, [60, 54]], [24, [36, 70]], [0, [28]]];
  const STEP = 14, X0 = 380, Y0 = 625, LH = 26, GAP = 12;
  let rects = [], seg = 0;

  function page() {
    code.replaceChildren();
    rects = [];
    LINES.forEach(([indent, segs], li) => {
      let x = X0 + indent;
      segs.forEach((w, si) => {
        const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', x); r.setAttribute('y', Y0 + li * LH);
        r.setAttribute('height', 14); r.setAttribute('rx', 7); r.setAttribute('width', 0);
        r.setAttribute('fill', si % 2 ? '#e8c9a6' : '#c29877');
        r.dataset.max = w;
        code.append(r); rects.push(r);
        x += w + GAP;
      });
    });
    seg = 0;
  }

  // width is an SVG attribute on a tiny element, so growing it per keystroke is cheap
  function typeTick() {
    const mood = svg.dataset.mood;
    if (mood === 'typing' || mood === 'fast') {
      if (seg >= rects.length) page();
      const r = rects[seg], w = Math.min(+r.getAttribute('width') + STEP, +r.dataset.max);
      r.setAttribute('width', w);
      caret.setAttribute('x', +r.getAttribute('x') + w + 4);
      caret.setAttribute('y', +r.getAttribute('y') - 2);
      if (w >= +r.dataset.max) seg++;
    }
    setTimeout(typeTick, mood === 'fast' ? 45 : 100 + Math.random() * 80);
  }

  const SCRIPT = [['typing', 4000], ['surprise', 1300], ['fast', 2600], ['happy', 3000]];
  let step = 0, timer;
  function next() {
    const [mood, ms] = SCRIPT[step];
    svg.dataset.mood = mood;
    if (mood === 'typing') page();
    step = (step + 1) % SCRIPT.length;
    timer = setTimeout(next, ms);
  }

  function blink() {
    svg.dataset.blink = '';
    setTimeout(() => delete svg.dataset.blink, 130);
    setTimeout(blink, 2200 + Math.random() * 3000);
  }

  // click = instant celebration, then the loop carries on
  svg.addEventListener('click', () => {
    clearTimeout(timer);
    step = SCRIPT.findIndex(([m]) => m === 'happy');
    next();
  });

  // eyes follow the cursor a little (mouse only, not with reduced motion)
  if (!reduce && matchMedia('(pointer: fine)').matches) {
    const eyes = svg.querySelector('.eyes');
    addEventListener('pointermove', e => {
      const b = svg.getBoundingClientRect();
      const dx = e.clientX - (b.left + b.width * 0.52), dy = e.clientY - (b.top + b.height * 0.45);
      const d = Math.hypot(dx, dy) || 1, k = Math.min(8, d / 30) / d;
      eyes.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    });
  }

  page(); next(); typeTick(); setTimeout(blink, 1800);
]]></script>
</svg>
