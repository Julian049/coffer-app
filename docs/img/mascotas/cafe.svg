<svg xmlns="http://www.w3.org/2000/svg" class="mascot" viewBox="40 170 950 655" role="img" aria-label="Mascota naranja tomando café" data-mood="idle">
<style><![CDATA[
  :root {
    --shadow: rgba(0, 0, 0, 0.18);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1); /* easings.net easeOutBack */
  }

  .mascot { cursor: pointer; }

  /* --- whole character: hop on happy --- */
  .rig { transform-box: fill-box; transform-origin: 50% 100%; }
  [data-mood="happy"] .rig { animation: hop 650ms var(--ease-out) 1; }
  @keyframes hop {
    0%   { transform: none; }
    18%  { transform: scale(1.04, 0.95); }
    50%  { transform: translateY(-40px) scale(0.98, 1.03); }
    82%  { transform: scale(1.02, 0.97); }
    100% { transform: none; }
  }
  .floor { transform-box: fill-box; transform-origin: 50% 50%; }
  [data-mood="happy"] .floor { animation: floor 650ms var(--ease-out) 1; }
  @keyframes floor { 50% { transform: scale(0.85); } }

  /* body: calm breathing, caffeine buzz */
  .bob { animation: breathe 1.6s ease-in-out infinite alternate; }
  [data-mood="buzz"] .bob { animation: buzz 70ms linear infinite alternate; }
  [data-mood="sip"] .bob, [data-mood="happy"] .bob { animation: none; }
  @keyframes breathe { to { transform: translateY(4px); } }
  @keyframes buzz { from { transform: translateX(-3px); } to { transform: translateX(3px); } }

  /* legs patter in place while buzzing */
  [data-mood="buzz"] .leg { animation: patter 140ms ease-in-out infinite alternate; }
  [data-mood="buzz"] .leg:nth-child(even) { animation-delay: -70ms; }
  @keyframes patter { to { transform: translateY(-16px); } }

  /* --- arm + cup: rotate around the shoulder, cup tilts around its own centre --- */
  .hold { transform-box: view-box; transform-origin: 351px 507px; transition: transform 500ms var(--ease-in-out); }
  .cup  { transform-box: view-box; transform-origin: 192px 517px; transition: transform 450ms var(--ease-in-out); }
  [data-mood="sip"] .hold   { transform: rotate(28deg); }
  [data-mood="sip"] .cup    { transform: rotate(24deg); transition-delay: 150ms; }
  [data-mood="happy"] .hold { transform: rotate(16deg); transition: transform 450ms var(--ease-out-back); }

  /* steam only while the coffee is resting */
  .steam { transition: opacity 250ms var(--ease-out); }
  .steam path { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; animation: steam 2.4s ease-in-out infinite; }
  .steam path:nth-child(2) { animation-delay: 800ms; }
  .steam path:nth-child(3) { animation-delay: 1600ms; }
  [data-mood]:not([data-mood="idle"]) .steam { opacity: 0; }
  @keyframes steam {
    0%   { opacity: 0; transform: translateY(10px) scaleX(0.8); }
    35%  { opacity: 0.9; }
    100% { opacity: 0; transform: translateY(-50px) scaleX(1.2); }
  }

  /* the original drawing's excitement lines */
  .lines line { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%;
    transform: scale(0.5); transition: opacity 180ms var(--ease-out), transform 300ms var(--ease-out-back); }
  [data-mood="buzz"] .lines line { opacity: 1; transform: none; }
  [data-mood="buzz"] .lines line { animation: flick 160ms linear infinite alternate; }
  [data-mood="buzz"] .lines line:nth-child(2) { animation-delay: -80ms; }
  @keyframes flick { to { opacity: 0.4; transform: scale(0.85); } }

  /* --- face --- */
  .eyes { transition: transform 220ms var(--ease-out); }
  .lid, .happy, .blush, .shine {
    transform-box: fill-box; transform-origin: 50% 50%;
    transition: transform 180ms var(--ease-out), opacity 180ms var(--ease-out);
  }
  .happy, .blush, .shine { opacity: 0; }
  .happy { transform: translateY(8px) scale(0.8); }
  [data-mood="sip"] .lid    { transform: scaleY(0.12); transition-delay: 350ms; }
  [data-mood="buzz"] .lid   { transform: scale(1.3); }
  [data-mood="buzz"] .shine { opacity: 1; }
  [data-mood="happy"] .lid  { opacity: 0; transform: scale(0.7); }
  [data-mood="happy"] .happy { opacity: 1; transform: none; }
  [data-mood="sip"] .blush, [data-mood="happy"] .blush { opacity: 0.5; }
  [data-mood="sip"] .blush { transition-delay: 350ms; }
  [data-blink]:is([data-mood="idle"], [data-mood="buzz"]) .lid { transform: scaleY(0.1); transition-duration: 70ms; }

  .heart { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0.6); }
  [data-mood="happy"] .heart { animation: heart 1.6s var(--ease-out) 200ms 1 both; }
  @keyframes heart {
    0%   { opacity: 0; transform: scale(0.6); }
    25%  { opacity: 1; transform: scale(1.1); }
    40%  { transform: none; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40px); }
  }

  @media (prefers-reduced-motion: reduce) {
    /* keep expressions, drop movement */
    .rig, .floor, .bob, .leg, .steam path, .lines line, .heart { animation: none !important; }
    .hold, .cup { transition: none !important; }
    .steam path { opacity: 0.6; }
    [data-mood="happy"] .heart { opacity: 1; transform: none; }
  }
]]></style>
  <ellipse class="floor" cx="585" cy="780" rx="380" ry="45" fill="var(--shadow)"/>

  <g class="steam" fill="none" stroke="#e3cdb6" stroke-width="12" stroke-linecap="round">
    <path d="M130 360c-14-16 14-32 0-48s14-32 0-48"/>
    <path d="M165 345c-14-16 14-32 0-48s14-32 0-48"/>
    <path d="M200 335c-14-16 14-32 0-48s14-32 0-48"/>
  </g>

  <g class="lines" stroke="#c68a58" stroke-width="26" stroke-linecap="round">
    <line x1="182" y1="312" x2="149" y2="248"/>
    <line x1="245" y1="298" x2="257" y2="212"/>
  </g>

  <g class="rig">
    <g fill="#dd7352">
      <rect class="leg" x="351" y="660" width="72" height="127"/>
      <rect class="leg" x="479" y="660" width="64" height="127"/>
      <rect class="leg" x="651" y="660" width="67" height="127"/>
      <rect class="leg" x="774" y="660" width="73" height="127"/>
    </g>

    <g class="bob">
      <rect x="840" y="452" width="118" height="107" fill="#dd7352"/>

      <g class="hold">
        <!-- arm root runs into the body so the shoulder never shows a gap when it rotates -->
        <polygon points="263,457 420,455 420,560 283,560" fill="#dd7352"/>
        <g class="cup">
          <g transform="translate(192 517) rotate(-12)">
            <polygon points="-64,-147 64,-147 74,-113 -74,-113" fill="#442a1c" stroke="#442a1c" stroke-width="10" stroke-linejoin="round"/>
            <rect x="-102" y="-118" width="204" height="32" rx="16" fill="#5a3926"/>
            <polygon points="-88,-87 88,-87 86,-44 -86,-44" fill="#f3eae1"/>
            <polygon points="-93,-46 93,-46 84,72 -84,72" fill="#c99b73" stroke="#c99b73" stroke-width="6" stroke-linejoin="round"/>
            <polygon points="-80,70 80,70 70,140 -70,140" fill="#5a3926" stroke="#5a3926" stroke-width="12" stroke-linejoin="round"/>
            <g transform="rotate(15 0 14)">
              <ellipse cx="0" cy="14" rx="24" ry="36" fill="#5a3926"/>
              <path d="M5 -18c-14 16 10 30 -4 62" fill="none" stroke="#c99b73" stroke-width="6" stroke-linecap="round"/>
            </g>
          </g>
        </g>
      </g>

      <rect x="351" y="333" width="496" height="337" fill="#dd7352"/>

      <rect class="blush" x="410" y="468" width="88" height="20" rx="10" fill="#f2a08a"/>
      <rect class="blush" x="699" y="468" width="88" height="20" rx="10" fill="#f2a08a"/>
      <g class="eyes">
        <rect class="lid" x="427" y="389" width="55" height="62" fill="#090909"/>
        <rect class="lid" x="715" y="389" width="56" height="62" fill="#090909"/>
        <rect class="shine" x="436" y="398" width="14" height="14" fill="#fff"/>
        <rect class="shine" x="724" y="398" width="14" height="14" fill="#fff"/>
        <path class="happy" d="M424 438 L454 406 L484 438" fill="none" stroke="#090909" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="happy" d="M713 438 L743 406 L773 438" fill="none" stroke="#090909" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <path class="heart" d="M600 290C560 262 548 240 566 224C580 212 596 220 600 232C604 220 620 212 634 224C652 240 640 262 600 290Z" fill="#c68a58"/>
<script><![CDATA[
  const svg = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const SCRIPT = [['idle', 3200], ['sip', 1800], ['buzz', 2400], ['happy', 2200]];
  let step = 0, timer;
  function next() {
    const [mood, ms] = SCRIPT[step];
    svg.dataset.mood = mood;
    step = (step + 1) % SCRIPT.length;
    timer = setTimeout(next, ms);
  }

  function blink() {
    svg.dataset.blink = '';
    setTimeout(() => delete svg.dataset.blink, 130);
    setTimeout(blink, 2200 + Math.random() * 3000);
  }

  // click = take a sip now, then the loop carries on
  svg.addEventListener('click', () => {
    clearTimeout(timer);
    step = SCRIPT.findIndex(([m]) => m === 'sip');
    next();
  });

  // eyes follow the cursor a little (mouse only, not with reduced motion)
  if (!reduce && matchMedia('(pointer: fine)').matches) {
    const eyes = svg.querySelector('.eyes');
    addEventListener('pointermove', e => {
      const b = svg.getBoundingClientRect();
      const dx = e.clientX - (b.left + b.width * 0.6), dy = e.clientY - (b.top + b.height * 0.35);
      const d = Math.hypot(dx, dy) || 1, k = Math.min(8, d / 30) / d;
      eyes.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    });
  }

  next(); setTimeout(blink, 1800);
]]></script>
</svg>
