version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: ["type:chore", "area:ops"]
    groups:
      androidx:
        patterns: ["androidx.*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    labels: ["type:chore", "area:ops"]
