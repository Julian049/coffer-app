name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Konsist architecture rules run inside testDebugUnitTest
      # Screenshots are compared against src/test/screenshots (Roborazzi)
      - run: ./gradlew lint ktlintCheck testDebugUnitTest assembleStaging -Proborazzi.test.verify=true
      - name: Upload staging APK
        uses: actions/upload-artifact@v7
        with:
          name: coffer-staging-apk
          path: app/build/outputs/apk/staging/*.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
