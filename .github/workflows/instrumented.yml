name: Instrumented

# S8-OPS02: the tests that need a device (Keystore, SQLCipher) on an API 31 emulator, the oldest Android the app
# supports. Release runs them before signing; a PR that touches them or this file runs them too.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/androidTest/**"
      - ".github/workflows/instrumented.yml"

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on API 31
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
